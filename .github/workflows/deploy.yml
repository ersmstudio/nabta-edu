name: Deploy Nabta Edu

on:
  push:
    branches: [ main ] # or master

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js App
        run: npm run build

      - name: Restart Application with PM2
        env:
          PORT: 3000
        run: |
          npm install -g pm2 || true
          pm2 delete nabta-edu || true
          pm2 start npm --name "nabta-edu" --cwd "$GITHUB_WORKSPACE" -- start
          pm2 save

      - name: Verify deployed homepage
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3000/ | grep -Fq "كل فكرة حلوة"; then
              echo "Nabta homepage is responding with the deployed version."
              exit 0
            fi
            sleep 2
          done
          pm2 logs nabta-edu --lines 50 || true
          echo "The new Nabta homepage did not appear on port 3000."
          exit 1
