name: Deploy Nabta Edu to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy & Restart Application
        run: |
          cd ~/apps/nabta-edu
          git pull origin main
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build
          pm2 reload nabta-edu || pm2 start npm --name "nabta-edu" -- start
          pm2 save