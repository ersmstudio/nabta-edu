name: Deploy Nabta Staging (Preview)

on:
  push:
    branches: [preview]

permissions:
  contents: read

concurrency:
  group: nabta-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy-staging:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      AUTH_TRUST_HOST: "true"
      CODE_RUNNER_URL: http://127.0.0.1:8787/execute
      PORT: "3001" # بورت مختلف للستاجنج عشان ما يحصلش تعارض مع الإنتاج على 3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check deployment settings and Docker
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CODE_RUNNER_TOKEN: ${{ secrets.CODE_RUNNER_TOKEN }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing STAGING_DATABASE_URL Actions secret."; exit 1; }
          test -n "$AUTH_SECRET" || { echo "Missing AUTH_SECRET Actions secret."; exit 1; }
          test -n "$ADMIN_EMAIL" || { echo "Missing ADMIN_EMAIL Actions secret."; exit 1; }
          test -n "$CODE_RUNNER_TOKEN" || { echo "Missing CODE_RUNNER_TOKEN Actions secret."; exit 1; }
          docker info >/dev/null
          docker compose version

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations to Staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Build Next.js App for Staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: npm run build

      - name: Restart Staging Application with PM2
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CODE_RUNNER_TOKEN: ${{ secrets.CODE_RUNNER_TOKEN }}
        run: |
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2
          pm2 delete nabta-staging || true
          # بنشغل التطبيق على بورت 3001 مثلاً أو حسب بورت الستاجنج عندك
          PORT=3001 pm2 start npm --name "nabta-staging" --cwd "$GITHUB_WORKSPACE" -- start
          pm2 save

      - name: Verify deployed staging homepage
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3001/ | grep -Fq "نبتة"; then
              echo "Nabta staging homepage is responding correctly."
              exit 0
            fi
            sleep 2
          done
          pm2 logs nabta-staging --lines 50 || true
          echo "The staging homepage did not appear on port 3001."
          exit 1
